<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Showcase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <style>
    * { padding: 0; margin: 0; border: 0; }
    *, *::before, *::after { box-sizing: border-box; }
    *::before, *::after { display: inline-block; }

    html, body { height: 100%; }

    body {
      background-color: #fff;
      overflow-x: hidden;
      font-family: 'Montserrat', sans-serif;
    }

    img { width: 100%; height: 100%; object-fit: cover; display: block; }

    section {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Work section ── */
    .work {
      background-color: #fff;
      overflow: hidden;
    }

    /* ── Canvases ── */
    canvas {
      position: absolute;
      top: 0;
      left: 0;
    }

    #grid-canvas { z-index: 0; }
    #letters-canvas { z-index: 1; }

    /* ── 3D text container ── */
    .text-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 2;
      pointer-events: none;
      perspective: 156.25rem;
      perspective-origin: center;
    }

    .letter {
      position: absolute;
      font-family: 'Montserrat', sans-serif;
      font-size: 14rem;
      font-weight: 900;
      color: #FF3AAA;
      z-index: 2;
      transform-origin: center;
      transform-style: preserve-3d;
      will-change: transform;
    }

    /* ── Cards ── */
    .cards {
      position: relative;
      width: 500vw;
      height: 100vh;
      padding-left: 100vw;
      overflow: hidden;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 10;
    }

    .card {
      width: 10%;
      height: 50%;
      padding: 0.5rem;
      background-color: #fff;
      border: 1px solid rgba(255, 58, 170, 0.18);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      box-shadow: 0 2px 24px rgba(255, 58, 170, 0.06);
    }

    .card-img {
      flex: 1;
      overflow: hidden;
    }

    /* Placeholder mientras no hay imágenes */
    .card-img-placeholder {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #fdf0fa 0%, #fce4f5 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      font-family: 'Montserrat', sans-serif;
    }
    .card-img-placeholder .ph-num {
      font-size: 2.5rem;
      font-weight: 900;
      color: rgba(255, 58, 170, 0.2);
      letter-spacing: 0.05em;
    }
    .card-img-placeholder .ph-soon {
      font-size: 0.45rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255, 58, 170, 0.35);
    }

    .card-copy {
      height: 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 0.25rem;
      text-transform: uppercase;
      font-family: monospace;
      font-size: 0.75rem;
      color: #FF3AAA;
    }

    /* ── Botón volver ── */
    .back-btn {
      position: fixed;
      top: 1.5rem;
      left: 1.5rem;
      z-index: 999;
      color: #FF3AAA;
      text-decoration: none;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      opacity: 0.9;
      transition: opacity 0.2s, letter-spacing 0.25s;
    }
    .back-btn:hover { opacity: 1; letter-spacing: 0.32em; }
  </style>
</head>
<body>

  <a class="back-btn" id="back-btn" href="../">← volver</a>

  <div class="index">

    <section class="work">
      <div class="text-container"></div>
      <div class="cards">

        <div class="card">
          <div class="card-img"><div class="card-img-placeholder"><span class="ph-num">01</span><span class="ph-soon">próximamente</span></div></div>
          <div class="card-copy"><p>Título</p><p>000001</p></div>
        </div>

        <div class="card">
          <div class="card-img"><div class="card-img-placeholder"><span class="ph-num">02</span><span class="ph-soon">próximamente</span></div></div>
          <div class="card-copy"><p>Título</p><p>000002</p></div>
        </div>

        <div class="card">
          <div class="card-img"><div class="card-img-placeholder"><span class="ph-num">03</span><span class="ph-soon">próximamente</span></div></div>
          <div class="card-copy"><p>Título</p><p>000003</p></div>
        </div>

        <div class="card">
          <div class="card-img"><div class="card-img-placeholder"><span class="ph-num">04</span><span class="ph-soon">próximamente</span></div></div>
          <div class="card-copy"><p>Título</p><p>000004</p></div>
        </div>

        <div class="card">
          <div class="card-img"><div class="card-img-placeholder"><span class="ph-num">05</span><span class="ph-soon">próximamente</span></div></div>
          <div class="card-copy"><p>Título</p><p>000005</p></div>
        </div>

        <div class="card">
          <div class="card-img"><div class="card-img-placeholder"><span class="ph-num">06</span><span class="ph-soon">próximamente</span></div></div>
          <div class="card-copy"><p>Título</p><p>000006</p></div>
        </div>

        <div class="card">
          <div class="card-img"><div class="card-img-placeholder"><span class="ph-num">07</span><span class="ph-soon">próximamente</span></div></div>
          <div class="card-copy"><p>Título</p><p>000007</p></div>
        </div>

        <div class="card">
          <div class="card-img"><div class="card-img-placeholder"><span class="ph-num">08</span><span class="ph-soon">próximamente</span></div></div>
          <div class="card-copy"><p>Título</p><p>000008</p></div>
        </div>

      </div>
    </section>

  </div>

  <!-- Librerías -->
  <script src="https://unpkg.com/lenis@1.1.20/dist/lenis.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {

      // ── Continuar música desde el banner principal ──
      (function() {
        const t   = parseFloat(sessionStorage.getItem('showcaseAudioTime')   || '0');
        const vol = parseFloat(sessionStorage.getItem('showcaseAudioVolume') || '0.18');
        const muted = sessionStorage.getItem('showcaseAudioMuted') === 'true';
        const aud = document.createElement('audio');
        aud.src    = '../audio/Myke Towers - HORA CERO (Instrumental).mp3';
        aud.loop   = true;
        aud.volume = vol;
        aud.muted  = muted;
        aud.preload = 'auto';
        document.body.appendChild(aud);
        aud.addEventListener('canplay', function handler() {
          aud.removeEventListener('canplay', handler);
          aud.currentTime = t;
          aud.play().catch(() => {});
        });

        // Guardar estado al volver al banner
        document.getElementById('back-btn').addEventListener('click', function() {
          sessionStorage.setItem('showcaseAudioTime',   aud.currentTime);
          sessionStorage.setItem('showcaseAudioVolume', aud.volume);
          sessionStorage.setItem('showcaseAudioMuted',  aud.muted);
        });
      })();

      // ── Scroll suave con Lenis ──
      const lenis = new Lenis();
      lenis.on('scroll', ScrollTrigger.update);
      gsap.ticker.add(time => lenis.raf(time * 1e3));
      gsap.ticker.lagSmoothing(0);

      const workSection = document.querySelector('.work');
      const cardsContainer = document.querySelector('.cards');
      const moveDistance = window.innerWidth * 5;
      let currentXPosition = 0;
      const lerp = (start, end, t) => start + (end - start) * t;

      // ── Canvas cuadrícula de puntos ──
      const gridCanvas = document.createElement('canvas');
      gridCanvas.id = 'grid-canvas';
      workSection.appendChild(gridCanvas);
      const gridCtx = gridCanvas.getContext('2d');

      const resizeGridCanvas = () => {
        const dpr = window.devicePixelRatio || 1;
        gridCanvas.width  = window.innerWidth  * dpr;
        gridCanvas.height = window.innerHeight * dpr;
        gridCanvas.style.width  = window.innerWidth  + 'px';
        gridCanvas.style.height = window.innerHeight + 'px';
        gridCtx.scale(dpr, dpr);
      };
      resizeGridCanvas();

      const drawGrid = (scrollProgress = 0) => {
        // Fondo blanco
        gridCtx.fillStyle = '#ffffff';
        gridCtx.fillRect(0, 0, gridCanvas.width, gridCanvas.height);
        // Puntos rosas
        gridCtx.fillStyle = '#FF3AAA';
        const dotSize = 1, spacing = 30;
        const rows = Math.ceil(window.innerHeight / spacing) + 1;
        const cols = Math.ceil(window.innerWidth  / spacing) + 15;
        const offset = (scrollProgress * spacing * 10) % spacing;
        for (let y = 0; y < rows; y++) {
          for (let x = 0; x < cols; x++) {
            gridCtx.beginPath();
            gridCtx.arc(x * spacing - offset, y * spacing, dotSize, 0, Math.PI * 2);
            gridCtx.fill();
          }
        }
      };

      // ── Three.js letras ──
      const lettersScene    = new THREE.Scene();
      const lettersCamera   = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1e3);
      lettersCamera.position.z = 20;

      const lettersRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      lettersRenderer.setSize(window.innerWidth, window.innerHeight);
      lettersRenderer.setClearColor(0, 0);
      lettersRenderer.setPixelRatio(window.devicePixelRatio);
      lettersRenderer.domElement.id = 'letters-canvas';
      workSection.appendChild(lettersRenderer.domElement);

      const createTextAnimationPath = (yPos, amplitude) => {
        const points = [];
        for (let i = 0; i <= 20; i++) {
          const t = i / 20;
          points.push(new THREE.Vector3(
            -25 + 50 * t,
            yPos + Math.sin(t * Math.PI) * -amplitude,
            (1 - Math.pow(Math.abs(t - 0.5) * 2, 2)) * -5
          ));
        }
        const curve = new THREE.CatmullRomCurve3(points);
        const line  = new THREE.Line(
          new THREE.BufferGeometry().setFromPoints(curve.getPoints(100)),
          new THREE.LineBasicMaterial({ color: 0xFF3AAA, linewidth: 1 })
        );
        line.curve = curve;
        return line;
      };

      const path = [
        createTextAnimationPath( 10,  2),
        createTextAnimationPath(  3.5, 1),
        createTextAnimationPath( -3.5,-1),
        createTextAnimationPath(-10, -2),
      ];
      path.forEach(line => lettersScene.add(line));

      const textContainer   = document.querySelector('.text-container');
      const letterPositions = new Map();

      path.forEach((line, i) => {
        line.letterElements = Array.from({ length: 15 }, () => {
          const el = document.createElement('div');
          el.className   = 'letter';
          el.textContent = ['D', 'U', 'F', 'I'][i];
          textContainer.appendChild(el);
          letterPositions.set(el, {
            current: { x: 0, y: 0 },
            target:  { x: 0, y: 0 },
          });
          return el;
        });
      });

      const lineSpeedMultipliers = [0.8, 1, 0.7, 0.9];

      const updateTargetPositions = (scrollProgress = 0) => {
        path.forEach((line, lineIndex) => {
          line.letterElements.forEach((element, i) => {
            const point = line.curve.getPoint(
              (i / 14 + scrollProgress * lineSpeedMultipliers[lineIndex]) % 1
            );
            const vector    = point.clone().project(lettersCamera);
            const positions = letterPositions.get(element);
            positions.target = {
              x: (-vector.x * 0.5 + 0.5) * window.innerWidth,
              y: (-vector.y * 0.5 + 0.5) * window.innerHeight,
            };
          });
        });
      };

      const updateLetterPositions = () => {
        letterPositions.forEach((positions, element) => {
          const distX = positions.target.x - positions.current.x;
          if (Math.abs(distX) > window.innerWidth * 0.7) {
            positions.current.x = positions.target.x;
            positions.current.y = positions.target.y;
          } else {
            positions.current.x = lerp(positions.current.x, positions.target.x, 0.07);
            positions.current.y = lerp(positions.current.y, positions.target.y, 0.07);
          }
          element.style.transform =
            `translate(-50%, -50%) translate3d(${positions.current.x}px, ${positions.current.y}px, 0px)`;
        });
      };

      const updateCardsPosition = () => {
        const targetX = -(window.innerWidth * 5) * (ScrollTrigger.getAll()[0]?.progress || 0);
        currentXPosition = lerp(currentXPosition, targetX, 0.07);
        gsap.set(cardsContainer, { x: currentXPosition });
      };

      const animate = () => {
        updateLetterPositions();
        updateCardsPosition();
        lettersRenderer.render(lettersScene, lettersCamera);
        requestAnimationFrame(animate);
      };

      // ── ScrollTrigger principal (pin + scrub) ──
      ScrollTrigger.create({
        trigger: '.work',
        start: 'top top',
        end: '+=700%',
        pin: true,
        pinSpacing: true,
        scrub: 1,
        onUpdate: self => {
          updateTargetPositions(self.progress);
          drawGrid(self.progress);
        },
      });

      drawGrid(0);
      animate();
      updateTargetPositions(0);

      window.addEventListener('resize', () => {
        resizeGridCanvas();
        drawGrid(ScrollTrigger.getAll()[0]?.progress || 0);
        lettersCamera.aspect = window.innerWidth / window.innerHeight;
        lettersCamera.updateProjectionMatrix();
        lettersRenderer.setSize(window.innerWidth, window.innerHeight);
        updateTargetPositions(ScrollTrigger.getAll()[0]?.progress || 0);
      });

    });
  </script>

</body>
</html>
