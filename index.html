<body>

  <div class="word-container" role="heading" aria-level="1">
    <span class="word" id="pasta" aria-label="DUFITUFI">DUFITUFI</span>
  </div>
  <!-- botón de redes -->
  <button class="social-btn" id="social-btn" onclick="toggleSocial()" aria-label="Redes sociales">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

  <!-- panel de redes -->
  <div class="social-panel" id="social-panel">
    <a class="social-card" data-platform="tiktok" href="https://www.tiktok.com/@dufitufi_" target="_blank" rel="noopener noreferrer">
      <div class="sc-icon">

          <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.1V9.01a6.27 6.27 0 0 0-.79-.05 6.34 6.34 0 0 0-6.34 6.34 6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.33-6.34V8.69a8.18 8.18 0 0 0 4.78 1.52V6.78a4.85 4.85 0 0 1-1.01-.09z"/>
        </svg>
      </div>
      <span class="sc-name">TikTok</span>

    </a>
    <a class="social-card" data-platform="youtube" href="https://www.youtube.com/@DuFiTuFi" target="_blank" rel="noopener noreferrer">
      <div class="sc-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M21.58 7.19c-.23-.86-.91-1.54-1.77-1.77C18.25 5 12 5 12 5s-6.25 0-7.81.42c-.86.23-1.54.91-1.77 1.77C2 8.75 2 12 2 12s0 3.25.42 4.81c.23.86.91 1.54 1.77 1.77C5.75 19 12 19 12 19s6.25 0 7.81-.42c.86-.23 1.54-.91 1.77-1.77C22 15.25 22 12 22 12s0-3.25-.42-4.81zM10 15V9l5.2 3-5.2 3z"/>

    <a class="social-card" data-platform="x" href="https://x.com/4lxgrr" target="_blank" rel="noopener noreferrer">
      <div class="sc-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.73-8.835L1.254 2.25H8.08l4.259 5.622zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
        </svg>

  <div class="pasta-phrase" id="pasta-phrase"></div>

  <!-- easter egg del "pasta" -->
  <div class="overlay" id="overlay-easter" onclick="handleClick(event,'easter')" role="dialog" aria-modal="true" aria-label="Easter egg: PASTA">
    <div class="modal" style="align-items:center; justify-content:center; gap:0.8rem;">
      <div class="easter-title">🍝 PASTA 🍝</div>
      <div class="easter-sub">has encontrado el secreto</div>
      <button class="close-btn" onclick="closeModal('easter')">CERRAR</button>
    </div>
  </div>

  <!-- overlay de los 10 clicks -->
  <div class="overlay" id="overlay-secret" onclick="handleClick(event,'secret')" role="dialog" aria-modal="true" aria-label="Mensaje secreto">
    <div class="modal" style="align-items:center; justify-content:center; gap:0.8rem;">
      <div class="secret-msg">eres de los nuestros,<br><span>ya sabes lo que hay</span></div>
      <button class="close-btn" onclick="closeModal('secret')">CERRAR</button>
    </div>
  </div>

  <!-- control de volumen -->
  <div class="vol-ctrl" role="group" aria-label="Control de volumen">
    <!-- accesible por teclado -->
    <svg id="volIcon" viewBox="0 0 24 24" onclick="toggleVolMute()"
         role="button" tabindex="0" aria-label="Silenciar o activar sonido"
         onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleVolMute();}"
         xmlns="http://www.w3.org/2000/svg">
      <path id="volIconPath" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
    </svg>
    <input type="range" id="volSlider" min="0" max="100" value="50"
           aria-label="Volumen" oninput="setVolume(this.value)">
  </div>

  <!-- splash de entrada -->
  <div class="splash" id="splash" onclick="enterPage()"
       role="button" tabindex="0" aria-label="Entrar a la p&#225;gina"
       onkeydown="if(event.key==='Enter')enterPage()">
    <div class="splash-text">dale click para entrar</div>
  </div>

  <canvas id="pasta-3d"        aria-hidden="true"></canvas>
  <canvas id="pasta-3d-bottom" aria-hidden="true"></canvas>
  <canvas id="cursor-trail"    aria-hidden="true"></canvas>

  <!-- no descargo el audio hasta que el usuario entre, ahorra datos -->
  <audio id="audio-player" src="audio/LIL NAAY X MYKE TOWERS - PENDING (Instrumental) - (320 Kbps).mp3" preload="none"></audio>

  <script>
    const IS_MOBILE = navigator.maxTouchPoints > 0;
    const el = document.getElementById('pasta');

    function openModal(id) {
      document.getElementById('overlay-' + id).classList.add('visible');
    }

    function closeModal(id) {
      document.getElementById('overlay-' + id).classList.remove('visible');
    }

    function handleClick(e, id) {
      if (e.target === document.getElementById('overlay-' + id)) closeModal(id);
    }

    // variables globales
    let cursorX = -9999, cursorY = -9999;
    let starR = 255, starG = 58, starB = 170;
    let pastaEntered = false;

    let orientX = 0, orientY = 0;
    window.addEventListener('deviceorientation', e => {
      orientX = Math.max(-1, Math.min(1, (e.gamma || 0) / 25));
      orientY = Math.max(-1, Math.min(1, ((e.beta  || 45) - 45) / 25));
    }, { passive: true });

    // starfield
    (function() {
      const canvas = document.getElementById('stars-canvas');
      const ctx = canvas.getContext('2d');
      const STAR_COUNT = IS_MOBILE ? 50 : 160;
      let stars = [];
      let _sFrame = 0;
      let _sRafId;

      function resize() {
        canvas.width  = window.innerWidth;
        canvas.height = window.innerHeight;
      }

      function initStars() {
        stars = [];
        for (let i = 0; i < STAR_COUNT; i++) {
          stars.push({
            x:     Math.random() * canvas.width,
            y:     Math.random() * canvas.height,
            r:     Math.random() * 2.6 + 1.4,
            vx:    (Math.random() - 0.5) * 0.52,
            vy:    (Math.random() - 0.5) * 0.52,
            alpha: Math.random() * 0.5 + 0.4,
            da:    (Math.random() * 0.005 + 0.001) * (Math.random() < 0.5 ? 1 : -1),
            minA:  0.25,
            maxA:  0.95
          });
        }
      }

      function draw() {
        // si la pestaña no está activa, paro
        if (document.hidden) return;
        // en móvil voy a 30fps, ahorra batería
        if (IS_MOBILE && ++_sFrame & 1) { _sRafId = requestAnimationFrame(draw); return; }
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (const s of stars) {
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${starR},${starG},${starB},${s.alpha.toFixed(3)})`;
          ctx.fill();

          s.x += s.vx;
          s.y += s.vy;
          // las estrellas huyen del cursor
          if (!IS_MOBILE) {
            const _dx = s.x - cursorX, _dy = s.y - cursorY;
            const _d  = Math.sqrt(_dx * _dx + _dy * _dy);
            if (_d < 120 && _d > 0) {
              const _f = (120 - _d) / 120 * 2.2;
              s.x += (_dx / _d) * _f;
              s.y += (_dy / _d) * _f;
            }
          }
          s.alpha += s.da;

          s.x += orientX * 0.45;
          s.y += orientY * 0.45;
          if (s.alpha >= s.maxA || s.alpha <= s.minA) s.da *= -1;
          if (s.x < -2) s.x = canvas.width + 2;
          if (s.x > canvas.width + 2) s.x = -2;
          if (s.y < -2) s.y = canvas.height + 2;
          if (s.y > canvas.height + 2) s.y = -2;
        }
        _sRafId = requestAnimationFrame(draw);
      }

      resize();
      initStars();
      draw();
      window.addEventListener('resize', () => { resize(); initStars(); });
      // al volver a la pestaña, cancelo el rAF pendiente antes de reanudar (evita doble loop)
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) { cancelAnimationFrame(_sRafId); draw(); }
      });
    })();

    // audio
    const audio = document.getElementById('audio-player');
    audio.loop = true;

    // volumen
    const _volPaths = {
      off: 'M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z',
      low:  'M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 5V4L9 9H5z',
      high: 'M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z'
    };
    function setVolume(val) {
      val = Number(val);
      // curva para que el slider 50% suene como un 50% de verdad
      audio.volume = Math.pow(val / 100, 2.5);
      audio.muted  = (val === 0);
      const slider = document.getElementById('volSlider');
      slider.style.setProperty('--vol-pct', val + '%');
      const path = document.getElementById('volIconPath');
      path.setAttribute('d', val === 0 ? _volPaths.off : val < 50 ? _volPaths.low : _volPaths.high);
    }
    function toggleVolMute() {
      const slider = document.getElementById('volSlider');
      const cur = Number(slider.value);
      if (cur > 0) { slider._prev = cur; slider.value = 0; }
      else          { slider.value = slider._prev || 50; }
      setVolume(slider.value);
    }
    setVolume(50);

    // las estrellas ya se ven detrás del splash

    function enterPage() {
      if (navigator.vibrate) navigator.vibrate(40);
      const doEnter = () => {
        document.getElementById('splash').classList.add('hidden');
        document.getElementById('pasta').classList.add('entering');
        document.getElementById('pasta-3d').classList.add('visible');
        document.getElementById('pasta-3d-bottom').classList.add('visible');
        pastaEntered = true;
        document.querySelectorAll('.stagger-item').forEach((el, idx) => {
          setTimeout(() => el.classList.add('stagger-visible'), 180 + idx * 110);
        });
        audio.muted = false;
        const _sv = document.getElementById('volSlider');
        audio.volume = _sv ? Math.pow(Number(_sv.value) / 100, 2.5) : 0.18;
        audio.play().catch(() => {});
      };
      if (document.startViewTransition) {
        document.startViewTransition(doEnter);
      } else {
        doEnter();
      }
    }

    // frase aleatoria bajo el título
    (function() {
      const phrases = [
        'hey'
      ];
      document.getElementById('pasta-phrase').textContent =
        phrases[Math.floor(Math.random() * phrases.length)];
    })();

    // trail del cursor
    (function() {
      let lastTrail = 0;
      function spawnTrail(x, y) {
        const d = document.createElement('div');
        d.className = 'trail-dot';
        const sz = Math.random() * 5 + 3;
        d.style.cssText = `left:${x}px;top:${y}px;width:${sz}px;height:${sz}px;` +
          `margin-left:${(Math.random()*8-4).toFixed(1)}px;margin-top:${(Math.random()*8-4).toFixed(1)}px`;
        document.body.appendChild(d);
        setTimeout(() => d.remove(), 500);
      }
      window.addEventListener('mousemove', e => {
        cursorX = e.clientX; cursorY = e.clientY;
        const now = Date.now();
        if (now - lastTrail > 35) { spawnTrail(e.clientX, e.clientY); lastTrail = now; }
      });
      window.addEventListener('touchmove', e => {
        cursorX = e.touches[0].clientX; cursorY = e.touches[0].clientY;
        const now = Date.now();
        if (now - lastTrail > 50) { spawnTrail(e.touches[0].clientX, e.touches[0].clientY); lastTrail = now; }
      }, { passive: true });
    })();

    // onda al hacer click
    (function() {
      function spawnRipple(x, y) {
        const r = document.createElement('div');
        r.className = 'ripple';
        r.style.left = x + 'px';
        r.style.top  = y + 'px';
        document.body.appendChild(r);
        setTimeout(() => r.remove(), 700);
      }
      window.addEventListener('click', e => spawnRipple(e.clientX, e.clientY));
      window.addEventListener('touchstart', e => {
        spawnRipple(e.touches[0].clientX, e.touches[0].clientY);
      }, { passive: true });
    })();

    // easter egg: escribe "pasta" en el teclado
    (function() {
      const seq = 'pasta';
      let idx = 0;
      document.addEventListener('keydown', e => {
        if (e.key.toLowerCase() === seq[idx]) {
          idx++;
          if (idx === seq.length) { idx = 0; openModal('easter'); }
        } else {
          idx = e.key.toLowerCase() === seq[0] ? 1 : 0;
        }
      });
    })();

    // 10 clicks rápidos = modal secreto
    (function() {
      let clicks = 0, timer = null;
      document.addEventListener('click', () => {
        clicks++;
        clearTimeout(timer);
        timer = setTimeout(() => { clicks = 0; }, 2500);
        if (clicks >= 10) { clicks = 0; openModal('secret'); }
      });
    })();

    // toast
    function showToast(msg) {
      const t = document.createElement('div');
      t.className = 'toast';
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 2100);
    }

    // efecto tilt 3D en el título
    (function() {
      const container = document.querySelector('.word-container');
      let tiltX = 0, tiltY = 0, targetX = 0, targetY = 0;
      window.addEventListener('mousemove', e => {
        if (!pastaEntered) return;
        const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
        targetX = (e.clientY - cy) / cy * -16;
        targetY = (e.clientX - cx) / cx *  16;
      });
      window.addEventListener('mouseleave', () => { targetX = 0; targetY = 0; });
      let _tf = 0;
      (function loop() {
        // en móvil voy a 30fps
        if (!IS_MOBILE || ++_tf & 1) {
          const ox = -orientY * 10, oy = orientX * 10;
          tiltX += ((targetX + ox) - tiltX) * 0.08;
          tiltY += ((targetY + oy) - tiltY) * 0.08;
          if (pastaEntered) {
            container.style.transform =
              `perspective(500px) rotateX(${tiltX.toFixed(2)}deg) rotateY(${tiltY.toFixed(2)}deg)`;
          }
        }
        requestAnimationFrame(loop);
      })();
    })();

    // efecto magnético en las tarjetas de redes
    (function() {
      // solo las activas, no instagram
      document.querySelectorAll('.social-card[data-platform="tiktok"], .social-card[data-platform="youtube"], .social-card[data-platform="x"]').forEach(el => {
        el.addEventListener('mousemove', e => {
          if (!pastaEntered) return;
          const r = el.getBoundingClientRect();
          const x = (e.clientX - (r.left + r.width  / 2)) * 0.28;
          const y = (e.clientY - (r.top  + r.height / 2)) * 0.28;
          el.style.transition = 'transform 0.12s ease-out';
          el.style.transform  = `translate(${x}px, ${y}px) scale(1.05)`;
        });
        el.addEventListener('mouseleave', () => {
          el.style.transition = 'transform 0.45s cubic-bezier(0.23,1,0.32,1)';
          el.style.transform  = 'translate(0, 0) scale(1)';
        });
      });
    })();

    // konami code
    (function() {
      const KONAMI = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown',
                      'ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
      let buf = [];
      window.addEventListener('keydown', e => {
        buf.push(e.key);
        if (buf.length > KONAMI.length) buf.shift();
        if (buf.join() === KONAMI.join()) {
          buf = [];
          // flash de colores
          const flash = document.createElement('div');
          flash.style.cssText =
            'position:fixed;inset:0;z-index:9999;pointer-events:none;' +
            'background:radial-gradient(circle,#ff00bb88 0%,#00000000 70%);' +
            'animation:konami-flash 0.7s ease-out forwards';
          document.body.appendChild(flash);
          setTimeout(() => flash.remove(), 800);
          // toast
          showToast('⬆⬆⬇⬇⬅➡⬅➡ BA 🎮 KONAMI!');
          // vibración
          if (navigator.vibrate) navigator.vibrate([80,40,80,40,200]);
          // rainbow en el título 6 segundos
          const pasta = document.getElementById('pasta');
          pasta.classList.add('rainbow');
          setTimeout(() => pasta.classList.remove('rainbow'), 6000);
        }
      });
    })();

    // escape cierra los modales
    document.addEventListener('keydown', e => {
      if (e.key !== 'Escape') return;
      document.querySelectorAll('.overlay.visible').forEach(o => {
        closeModal(o.id.replace('overlay-', ''));
      });
    });
  </script>

  <!-- efecto de presión en el texto -->
  <script>
    (function initTextPressure() {
      const el = document.getElementById('pasta');
      if (!el) return;

      const chars = 'DUFITUFI'.split('');
      el.innerHTML = '';
      const spans = chars.map(ch => {
        const s = document.createElement('span');
        s.className = 'pressure-letter';
        s.textContent = ch;
        el.appendChild(s);
        return s;
      });

      const N      = spans.length;
      const mouse  = { x: 0, y: 0 };
      const cursor = { x: 0, y: 0 };
      const attr   = (d, max, min, range) => Math.max(min, range - Math.abs(range * d / max));

      // typed arrays para no escribir en el DOM si no cambia nada
      const lastWght = new Int16Array(N).fill(-1);
      const lastWdth = new Int16Array(N).fill(-1);
      const lastItal = new Array(N).fill('');

      let elRect    = { left: 0, top: 0, width: 1, height: 1 };
      let animating = false;
      let fontReady = false;

      function cacheLayout() {
        // cacheo solo el rect del contenedor, las posiciones de letra las calculo
        elRect = el.getBoundingClientRect();
      }

      function animate() {
        // si la página no está activa, no animo
        if (document.hidden) return;
        
        const dx = cursor.x - mouse.x;
        const dy = cursor.y - mouse.y;
        mouse.x += dx * 0.1;  // lerp rápido para converger antes y parar el loop
        mouse.y += dy * 0.1;

        const max = Math.max(elRect.width / 2, 1);
        const ey  = elRect.top + elRect.height / 2;
        let anyWrite = false;

        for (let i = 0; i < N; i++) {
          // posición de cada letra por cálculo, sin tocar el DOM
          const ex = elRect.left + (i + 0.5) / N * elRect.width;
          const d  = Math.hypot(mouse.x - ex, mouse.y - ey);

          const wght = Math.floor(attr(d, max, 100, 800));
          const wdth = Math.floor(attr(d, max, 5,  195));
          const ital = attr(d, max, 0, 1).toFixed(2);

          // solo escribo si cambió, fontVariationSettings es costoso
          if (wght !== lastWght[i] || wdth !== lastWdth[i] || ital !== lastItal[i]) {
            if (fontReady) {
              spans[i].style.fontVariationSettings = `'wght' ${wght}, 'wdth' ${wdth}, 'ital' ${ital}`;
            }
            lastWght[i] = wght;
            lastWdth[i] = wdth;
            lastItal[i] = ital;
            anyWrite = true;
          }
        }

        // cuando el cursor llegó al target y no hay cambios, paro el loop
        if (Math.abs(dx) < 0.3 && Math.abs(dy) < 0.3 && !anyWrite) {
          animating = false;
          return;
        }
        requestAnimationFrame(animate);
      }

      function startAnimate() {
        if (!animating && fontReady) { animating = true; requestAnimationFrame(animate); }
      }

      // Esperar a que la fuente variable esté cargada
      Promise.all([
        document.fonts.load('1em "Roboto Flex"'),
        new Promise(resolve => {
          if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', resolve);
          } else {
            resolve();
          }
        })
      ]).then(() => {
        fontReady = true;
        cacheLayout();
        startAnimate();
        console.log('✓ Efecto de presión activado');
      }).catch(err => {
        console.warn('⚠ Fuente Roboto Flex no disponible:', err);
        fontReady = true;  // intentar de todas formas
        cacheLayout();
        startAnimate();
      });

      window.addEventListener('mousemove', e => {
        cursor.x = e.clientX; cursor.y = e.clientY;
        startAnimate();
      });
      window.addEventListener('touchmove', e => {
        cursor.x = e.touches[0].clientX;
        cursor.y = e.touches[0].clientY;
        startAnimate();
      }, { passive: true });

      window.addEventListener('resize', () => { cacheLayout(); startAnimate(); });
      window.addEventListener('visibilitychange', () => {
        if (!document.hidden) startAnimate();
      });

      if (IS_MOBILE) {
        window.addEventListener('deviceorientation', e => {
          if (!elRect.width) return;
          cursor.x = elRect.left + elRect.width  / 2 + (e.gamma || 0) / 45 * elRect.width  / 2;
          cursor.y = elRect.top  + elRect.height / 2 + ((e.beta  || 45) - 45) / 45 * elRect.height / 2;
          startAnimate();
        }, { passive: true });
      }
    })();
  </script>

  <!-- lógica para abrir/cerrar el panel de redes -->
  <script>
    (function() {
      const socialBtn   = document.getElementById('social-btn');
      const socialPanel = document.getElementById('social-panel');
      let socialOpen    = false;
      let closeTimer    = null;
      const CLOSE_MS    = 460;

      function closeSocialPanel() {
        if (!socialOpen) return;
        socialOpen = false;
        socialBtn.classList.remove('open');
        socialPanel.classList.remove('open');
        socialPanel.classList.add('closing');
        if (closeTimer) clearTimeout(closeTimer);
        closeTimer = setTimeout(() => {
          socialPanel.classList.remove('closing');
        }, CLOSE_MS);
      }

      window.toggleSocial = function() {
        if (socialOpen) {
          closeSocialPanel();
        } else {
          if (closeTimer) clearTimeout(closeTimer);
          socialPanel.classList.remove('closing');
          socialOpen = true;
          socialBtn.classList.add('open');
          socialPanel.classList.add('open');
        }
        if (navigator.vibrate) navigator.vibrate(18);
      };

      // Cerrar al pulsar fuera del panel y del botón
      document.addEventListener('click', e => {
        if (!socialOpen) return;
        if (socialPanel.contains(e.target) || socialBtn.contains(e.target)) return;
        closeSocialPanel();
      });
    })();
  </script>

  <!-- dragón 3D con Three.js -->
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const isMob = navigator.maxTouchPoints > 0;
    const canvas1 = document.getElementById('pasta-3d');
    const canvas2 = document.getElementById('pasta-3d-bottom');
    const W = Math.max(canvas1.offsetWidth || 120, 75);

    // un solo renderer para los dos dragónes, renderizo offscreen y copio con drawImage
    const offscreen = document.createElement('canvas');
    offscreen.width  = W;
    offscreen.height = W;
    const renderer = new THREE.WebGLRenderer({
      canvas: offscreen,
      alpha: true,
      antialias: !isMob,
      preserveDrawingBuffer: true  // requerido para drawImage cross-canvas
    });
    renderer.setSize(W, W);
    renderer.setPixelRatio(isMob ? Math.min(devicePixelRatio, 1.5) : Math.min(devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 0);

    // los canvas visibles reciben el render copiado
    canvas1.width  = W; canvas1.height = W;
    canvas2.width  = W; canvas2.height = W;
    const ctx1 = canvas1.getContext('2d');
    const ctx2 = canvas2.getContext('2d');

    // helper para escena+cámara+luces, los dos dragónes usan lo mismo
    function buildScene() {
      const scene  = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
      camera.position.z = 3.5;
      scene.add(new THREE.AmbientLight(0xffffff, 0.6));
      const l1 = new THREE.PointLight(0xFF00CC, 5, 20);
      l1.position.set(2, 2, 2); scene.add(l1);
      const l2 = new THREE.PointLight(0x0044FF, 2.5, 20);
      l2.position.set(-2, -1, 0); scene.add(l2);
      return { scene, camera };
    }

    const { scene: scene1, camera: cam1 } = buildScene();
    const { scene: scene2, camera: cam2 } = buildScene();

    // material rosa compartido entre los dos modelos
    const mat = new THREE.MeshStandardMaterial({
      color: 0xDD0099,
      metalness: 0.75,
      roughness: 0.18,
      emissive: 0x550033,
      emissiveIntensity: 0.5,
    });

    // si el canvas no está visible, no renderizo
    let vis1 = true, vis2 = true;
    const io = new IntersectionObserver(entries => {
      for (const e of entries) {
        if (e.target === canvas1) vis1 = e.isIntersecting;
        if (e.target === canvas2) vis2 = e.isIntersecting;
      }
    }, { threshold: 0 });
    io.observe(canvas1);
    io.observe(canvas2);

    let model1 = null, model2 = null;
    let baseY   = 0;
    let frameCount = 0;
    // el segundo dragón se renderiza menos frames, no se nota visualmente
    const RATE2 = isMob ? 6 : 2;

    // loop único para los dos dragónes
    function loop(now) {
      requestAnimationFrame(loop);
      if (document.hidden) return; // si está en background, no renderizo

      frameCount++;
      const t = now / 1000;

      if (vis1 && model1) {
        model1.position.y = baseY + Math.sin(t * 1.5) * 0.22;
        model1.rotation.z = Math.sin(t * 0.9) * 0.11;
        renderer.render(scene1, cam1);
        ctx1.clearRect(0, 0, canvas1.width, canvas1.height);
        ctx1.drawImage(offscreen, 0, 0, canvas1.width, canvas1.height);
      }

      if (vis2 && model2 && frameCount % RATE2 === 0) {
        model2.position.y = baseY + Math.sin(t * 1.5 + 1.2) * 0.22;
        model2.rotation.z = Math.sin(t * 0.9 + 1.2) * 0.11;
        renderer.render(scene2, cam2);
        ctx2.clearRect(0, 0, canvas2.width, canvas2.height);
        ctx2.drawImage(offscreen, 0, 0, canvas2.width, canvas2.height);
      }
    }

    // Reanudar loop cuando el usuario vuelve a la pestaña
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) requestAnimationFrame(loop);
    });

    // cargo el GLB
    new GLTFLoader().load('Dragon.glb', gltf => {
      const m = gltf.scene;

      // centro y escalo el modelo
      const box    = new THREE.Box3().setFromObject(m);
      const center = box.getCenter(new THREE.Vector3());
      const size   = box.getSize(new THREE.Vector3());
      const scale  = 3.0 / Math.max(size.x, size.y, size.z);
      m.scale.setScalar(scale);
      m.position.copy(center.multiplyScalar(-scale));
      baseY = m.position.y;

      // aplico el material rosa
      m.traverse(child => { if (child.isMesh) child.material = mat; });
      scene1.add(m);
      model1 = m;

      // clono para el segundo dragón con el mismo material
      const m2 = m.clone(true);
      m2.traverse(child => { if (child.isMesh) child.material = mat; });
      scene2.add(m2);
      model2 = m2;

      requestAnimationFrame(loop);

      // al redimensionar, actualizo el renderer
      function onResize() {
        const s = Math.max(canvas1.offsetWidth, canvas2.offsetWidth, 75);
        if (s !== offscreen.width) {
          offscreen.width  = s;
          offscreen.height = s;
          renderer.setSize(s, s);
        }
        // actualizo los canvas visibles
        if (canvas1.offsetWidth > 0) {
          canvas1.width  = canvas1.offsetWidth;
          canvas1.height = canvas1.offsetWidth;
        }
        if (canvas2.offsetWidth > 0) {
          canvas2.width  = canvas2.offsetWidth;
          canvas2.height = canvas2.offsetWidth;
        }
      }
      new ResizeObserver(onResize).observe(canvas1);
      new ResizeObserver(onResize).observe(canvas2);
    });
  </script>

  <!-- trail del cursor, solo en desktop -->
  <script>
    (function() {
      if (navigator.maxTouchPoints > 0) return;
      const canvas = document.getElementById('cursor-trail');
      const ctx = canvas.getContext('2d');
      const particles = [];
      const MAX_TRAIL = 80; // límite para no crear infinitas partículas

      function resize() {
        canvas.width  = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      window.addEventListener('mousemove', e => {
        if (particles.length >= MAX_TRAIL) return; // si ya hay bastantes, ignoro
        const n = Math.floor(Math.random() * 2) + 1;
        for (let i = 0; i < n; i++) {
          if (particles.length >= MAX_TRAIL) break;
          particles.push({
            x:     e.clientX + (Math.random() - 0.5) * 8,
            y:     e.clientY + (Math.random() - 0.5) * 8,
            r:     Math.random() * 3.2 + 1.2,
            life:  1.0,
            decay: 0.032 + Math.random() * 0.022,
            vx:    (Math.random() - 0.5) * 0.7,
            vy:    -(Math.random() * 1.4 + 0.4),
          });
        }
      });

      (function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.life -= p.decay;
          if (p.life <= 0) { particles.splice(i, 1); continue; }
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255,255,255,${(p.life * 0.88).toFixed(3)})`;
          ctx.fill();
        }
        requestAnimationFrame(draw);
      })();
    })();
  </script>
