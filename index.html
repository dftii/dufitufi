<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#DD0099">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="DuFiTuFi — banner">
<meta property="og:title" content="DuFiTuFi">
<meta property="og:description" content="DuFiTuFi — banner">
<meta property="og:type" content="website">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.175.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.175.0/examples/jsm/"
  }
}
</script>
<title>DuFiTuFi</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23000'/%3E%3Ctext x='50' y='72' font-size='70' font-family='Arial Black,sans-serif' font-weight='900' text-anchor='middle' fill='%23DD0099'%3ED%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Roboto+Flex:slnt,wdth,wght@-10..0,25..151,100..1000&display=swap" rel="stylesheet">
<!-- precargo el modelo para que esté listo al entrar -->
<link rel="preload" href="Dragon.glb" as="fetch" crossorigin="anonymous">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/title.css">
<link rel="stylesheet" href="css/ui.css">
<link rel="stylesheet" href="css/dragons.css">
<link rel="stylesheet" href="css/cursor.css">
</head>
<body>

  <canvas id="stars-canvas" aria-hidden="true"></canvas>

  <div class="word-container">
    <h1 class="word" id="pasta" aria-label="DuFiTuFi">DUFITUFI</h1>
  </div>
  <p class="pasta-phrase" id="pasta-phrase">hey</p>

  <!-- easter egg: escribir "pasta" -->
  <dialog class="overlay" id="overlay-easter" aria-label="Easter egg: PASTA">
    <div class="modal modal--center">
      <p class="easter-title">🍝 PASTA 🍝</p>
      <p class="easter-sub">has encontrado el secreto</p>
      <button class="close-btn" type="button" data-close>CERRAR</button>
    </div>
  </dialog>

  <!-- 10 clicks rápidos -->
  <dialog class="overlay" id="overlay-secret" aria-label="Mensaje secreto">
    <div class="modal modal--center">
      <p class="secret-msg">eres de los nuestros,<br><span>ya sabes lo que hay</span></p>
      <button class="close-btn" type="button" data-close>CERRAR</button>
    </div>
  </dialog>

  <!-- control de volumen -->
  <div class="vol-ctrl" role="group" aria-label="Control de volumen">
    <button class="vol-btn" id="volBtn" type="button" aria-label="Silenciar" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path id="volIconPath" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
      </svg>
    </button>
    <input type="range" id="volSlider" min="0" max="100" value="50" aria-label="Volumen">
  </div>

  <!-- splash de entrada -->
  <button class="splash" id="splash" type="button" aria-label="Entrar a la página">
    <span class="splash-text">dale click para entrar</span>
  </button>

  <canvas id="pasta-3d"        aria-hidden="true"></canvas>
  <canvas id="pasta-3d-bottom" aria-hidden="true"></canvas>
  <canvas id="cursor-trail"    aria-hidden="true"></canvas>
  <div id="cursor-dot" aria-hidden="true"></div>

  <!-- avisos para lectores de pantalla y el toast -->
  <div id="toast-region" role="status" aria-live="polite"></div>

  <!-- no descargo el audio hasta que el usuario entre, ahorra datos -->
  <audio id="audio-player" src="audio/zeze-instrumental.mp3" preload="none" loop></audio>

  <script type="module" src="js/main.js"></script>
</body>
</html>
